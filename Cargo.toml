[package]
name = "litecast"
version = "1.3.3"
edition = "2024"
rust-version = "1.88"
description = "LiteCast Studio — lightweight OBS-style recorder / streamer (Rust + FLTK + ffmpeg)"

[dependencies]
fltk = { version = "1.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# v1.3.2: localtime_r for local-time log stamps (no chrono).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native audio capture (mic + system-audio loopback) on Windows only.
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_SystemInformation", # v1.3.2: GetLocalTime for log stamps
    "Win32_System_Registry",          # v1.3.3: Windows light/dark preference
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
